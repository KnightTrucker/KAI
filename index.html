<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020509}body{position:fixed;inset:0}#app{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;background:#020509;overflow:hidden}.scene{position:relative;height:100dvh;max-height:100dvh;aspect-ratio:882/1784;max-width:100vw;overflow:hidden;background:#020509}.scene>img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;user-select:none}.hotspot{position:absolute;z-index:3;border:0;background:transparent;border-radius:28px;padding:0}#navy{left:60%;top:32%;width:35%;height:10%}#tako{left:57%;top:55%;width:34%;height:9%}#book{left:64%;top:75%;width:33%;height:12%}@media (orientation:landscape){.scene{height:100dvh;width:auto}}</style></head>
<body><main id="app"><section class="scene"><img src="./assets/suite/home-a51-clean.webp?v=6" alt="">
<button id="navy" class="hotspot" aria-label="Apri ToraNavy" data-url="https://knighttrucker.github.io/TruckNavigator/"></button>
<button id="tako" class="hotspot" aria-label="Apri ToraTako" data-url="https://knighttrucker.github.io/ToraTako/"></button>
