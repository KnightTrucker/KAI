<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#020509">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="color-scheme" content="dark">
<title>Tora Suite</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:#020509;overflow:hidden;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
body{position:fixed;inset:0;color:#fff}
#app{position:relative;width:100%;height:100dvh;display:flex;justify-content:flex-start;align-items:center;background:#020509;overflow:hidden}
.scene{position:relative;width:min(100vw,calc(100dvh * 768 / 1536));aspect-ratio:768 / 1536;flex:0 0 auto;background:#020509 url('./assets/suite/cockpit-a51.webp?v=4') center center/contain no-repeat;border:0;touch-action:manipulation}
.scene img{display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;pointer-events:none}
.hotspot{position:absolute;border:0;background:transparent;padding:0;margin:0;border-radius:30px;cursor:pointer;touch-action:manipulation;z-index:5}
.hotspot::before{content:"";position:absolute;inset:0;border-radius:inherit;border:1px solid transparent;box-shadow:0 0 0 0 transparent;transition:.12s ease}
.hotspot:active::before,.hotspot:focus-visible::before{border-color:rgba(255,255,255,.65);box-shadow:0 0 30px var(--glow), inset 0 0 16px rgba(255,255,255,.05);background:rgba(255,255,255,.03)}
#navy{left:55.2%;top:30.6%;width:40.5%;height:19.8%;--glow:rgba(56,224,143,.7)}
#tako{left:53.0%;top:50.0%;width:39.5%;height:13.8%;--glow:rgba(255,151,46,.7)}
#book{left:57.1%;top:67.6%;width:36.3%;height:20.5%;--glow:rgba(69,184,255,.7)}
.toast{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translate(-50%,18px);z-index:10;background:rgba(2,7,12,.92);color:#eef6fb;border:1px solid rgba(255,255,255,.16);padding:10px 14px;border-radius:999px;font-size:12px;font-weight:800;opacity:0;transition:.18s ease;pointer-events:none;backdrop-filter:blur(10px);white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (orientation: landscape){#app{justify-content:center;align-items:center}.scene{width:min(calc(100dvh * 941 / 1672),100vw)}}
</style>
</head>
<body>
<main id="app" aria-label="Tora Suite cockpit launcher">
  <section class="scene" aria-label="Cockpit Tora Suite">
    <img id="homeVisual" src="./assets/suite/home-a51-clean.jpg?v=5" alt="" decoding="async" fetchpriority="high">
    <button id="navy" class="hotspot" type="button" aria-label="Apri ToraNavy" data-url="https://knighttrucker.github.io/TruckNavigator/"></button>
    <button id="tako" class="hotspot" type="button" aria-label="Apri ToraTako" data-url="https://knighttrucker.github.io/ToraTako/"></button>
    <button id="book" class="hotspot" type="button" aria-label="Apri ToraBook" data-url="https://knighttrucker.github.io/Diario/"></button>
  </section>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</main>
<script>
(()=>{
  const toast=document.getElementById('toast');
  const labels={navy:'ToraNavy',tako:'ToraTako',book:'ToraBook'};
  let timer=0;
  document.querySelectorAll('.hotspot').forEach(btn=>{
    btn.addEventListener('click',()=>{
      clearTimeout(timer);
      toast.textContent='Apro '+labels[btn.id]+'…';
      toast.classList.add('show');
      timer=setTimeout(()=>toast.classList.remove('show'),950);
      setTimeout(()=>{location.href=btn.dataset.url},90);
    });
  });
  if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=5').catch(()=>{}),{once:true})}
})();
</script>
</body>
</html>
